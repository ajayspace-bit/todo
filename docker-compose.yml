services:
  backend:
    build: .
    container_name: fastapi-todo-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: fastapi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ajay1234
      POSTGRES_DB: FASTAPI_TODO
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FASTAPI_TODO"]
      interval: 5s
      timeout: 5s
      retries: 10